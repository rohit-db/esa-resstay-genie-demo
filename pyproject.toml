[project]
name = "esa_resstay_demo"
version = "0.1.0"
description = "Synthetic ESA dev_gold replica generator for the ResStay Genie ontology demo"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
generate = "esa_resstay_demo.jobs.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esa_resstay_demo"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = ["slow: full-story generator test at 150 properties (about 30 seconds)"]
