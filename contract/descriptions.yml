# Business descriptions applied as Unity Catalog comments (tables, views, columns).
# Keys must match contract/dev_gold_mart.yml exactly.
version: 1
history_columns:
  hash_diff: "Hash of the business column values in the row, used to detect changes between loads."
  record_source: "Name of the source system or feed that delivered the row, such as the hotel PMS, the reservation system, master data, the CRM or the renovation feed."
  etl_id: "Load batch identifier, formatted as ETL- followed by the load date in yyyymmdd form."
  load_date_time: "Timestamp when the row was loaded into the mart."
  dq_status: "Data quality result recorded at load time. PASS means the row passed the load validation checks."
  active_start_date_time: "Start of the period during which this version of the row is in effect."
  active_end_date_time: "End of the period during which this version of the row is in effect. Open-ended current versions carry 9999-12-31 23:59:59."
  is_current: "True for the version of the row that is in effect now. Filter dimension and reservation joins on is_current = true to avoid duplicates from history rows."
  is_deleted: "Soft-delete flag, true when the source record has been deleted. Rows are not physically removed from the mart."
tables:
  fact_actual_stay:
    table: "One PMS stay ledger line: a room-charge line for each occupied room night (consumed_room_nights_count = 1), plus credit adjustment lines (consumed_room_nights_count = 0) posted on the checkout date for a share of stays. Join bk_property_id to dim_property.bk_property_id, bk_room_type_id to dim_room_type.bk_room_type_id, bk_rate_segment_id to dim_rate_segment.bk_rate_segment_id, bk_reservation_id to dim_reservation.bk_reservation_id, and bk_date_id to common.dim_date with CAST(bk_date_id AS INT) = BK_Date_Dim_Id, because bk_date_id is a yyyymmdd string. Filter every dimension join on is_current = true, because history rows exist."
    columns:
      fact_actual_stay_id: "Surrogate key for one ledger line, one per occupied room night or per credit adjustment."
      entity_id: "Source entity code of the hotel PMS ledger that produced the line."
      hkpms_subledger_sid: "Subledger line identifier from the hotel PMS, unique per ledger line."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_date_id: "Night of stay as a yyyymmdd string. Cast with CAST(bk_date_id AS INT) to join common.dim_date.BK_Date_Dim_Id."
      bk_reservation_id: "Reservation business key. Joins to dim_reservation.bk_reservation_id and fact_reservation_summary.bk_reservation_id."
      bk_rate_segment_id: "Rate segment business key. Joins to dim_rate_segment.bk_rate_segment_id."
      bk_room_type_id: "Room type business key. Joins to dim_room_type.bk_room_type_id."
      consumed_room_nights_count: "Occupied room nights on this line: 1 for a room-charge line for one night, 0 for a credit adjustment line."
      room_revenue_amount: "Room charge for the night in USD at the stay rate. Zero for complimentary stays and for credit adjustment lines."
      credit_revenue_amount: "Room revenue credited back to the guest in USD. Populated only on credit adjustment lines (consumed_room_nights_count = 0), posted on the checkout date. Zero on room-charge lines."
      other_rooms_revenue: "Other room-related revenue in USD: pet fees for the nights of a pet stay (up to 30 nights) and the early check-in fee on the arrival night."
      net_room_revenue: "Net room revenue in USD: room_revenue_amount minus credit_revenue_amount. Credit adjustment lines carry negative values."
      total_room_revenue: "Total room revenue in USD: room_revenue_amount plus other_rooms_revenue."

  fact_reservation_summary:
    table: "One reservation version per row, from the reservation system, including cancelled and no-show bookings. A reservation whose dates changed keeps its prior version with is_current = false. Join bk_reservation_id to dim_reservation.bk_reservation_id, bk_property_id to dim_property.bk_property_id, bk_crm_account_id to dim_crm_account.bk_crm_account_id, bk_channel_id to dim_channel.bk_channel_id, bk_promo_cd to dim_promotion.bk_promo_cd, bk_rate_segment_id to dim_rate_segment.bk_rate_segment_id, bk_room_type_id to dim_room_type.bk_room_type_id, and each LOS key to dim_los.bk_los_id. bk_date_id is the booking date as a yyyymmdd string; cast it with CAST(bk_date_id AS INT) to join common.dim_date. Filter on is_current = true."
    columns:
      fact_reservation_summary_id: "Surrogate key for one reservation version. A reservation with changed dates has one key per version."
      entity_id: "Source entity code of the reservation record, as carried from the reservation system."
      bk_reservation_id: "Reservation business key, shared by all versions of the reservation. Joins to dim_reservation.bk_reservation_id."
      bk_crm_account_id: "CRM account business key for account-linked bookings. Joins to dim_crm_account.bk_crm_account_id. Null when the booking is not linked to an account."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_date_id: "Booking date as a yyyymmdd string, not the stay date. Cast with CAST(bk_date_id AS INT) to join common.dim_date.BK_Date_Dim_Id."
      bk_channel_id: "Booking channel business key. Joins to dim_channel.bk_channel_id."
      bk_original_los_id: "Length of stay in nights at the original booking, as a string key. Joins to dim_los.bk_los_id."
      bk_current_los_id: "Length of stay in nights for this reservation version, as a string key. Joins to dim_los.bk_los_id."
      bk_otb_los_id: "On-the-books nights (nights after the latest audit date that are still booked), as a string key. Joins to dim_los.bk_los_id."
      bk_actual_los_id: "Nights consumed up to the latest audit date, as a string key. Joins to dim_los.bk_los_id."
      bk_rate_segment_id: "Rate segment business key. Joins to dim_rate_segment.bk_rate_segment_id."
      bk_room_type_id: "Room type business key. Joins to dim_room_type.bk_room_type_id."
      bk_promo_cd: "Promotion code. Joins to dim_promotion.bk_promo_cd. NONE means no promotion applied."
      booked_date: "Date the reservation was booked."
      original_arrival_date: "Arrival date at the original booking."
      original_departure_date: "Departure date at the original booking."
      current_arrival_date: "Arrival date for this reservation version."
      current_departure_date: "Departure date for this reservation version."
      actual_arrival_date: "Date the guest checked in. Null when the guest has not arrived."
      actual_departure_date: "Date the guest checked out. Null until the stay has ended."
      original_room_nights_count: "Room nights at the original booking."
      current_room_nights_count: "Room nights for this reservation version."
      otb_room_nights_count: "On-the-books room nights: nights after the latest audit date that are still booked. Zero for cancelled and no-show reservations."
      actual_room_nights_count: "Room nights consumed up to the latest audit date. Zero for cancelled and no-show reservations."
      original_room_revenue_amount: "Room revenue in USD at the original booking: original room nights times the nightly rate."
      current_room_revenue_amount: "Room revenue in USD for this reservation version: current room nights times the nightly rate."
      actual_room_revenue_amount: "Room revenue in USD consumed up to the latest audit date: actual room nights times the nightly rate."
      affiliate_revenue_total_amount_before_tax: "Room revenue in USD before tax for reservations with an affiliate code (AAA, AARP or USAA). Zero when no affiliate applies."
      reservation_cancel_flag: "True when the reservation was cancelled."
      cancel_date: "Date the reservation was cancelled. Null when the reservation was not cancelled."
      pets_flag: "True when the reservation includes a pet."

  fact_property_statistics:
    table: "One row per property per operating day, from the PMS night audit, from the start of available history (or the acquisition date, if later) through the latest audit date. Join bk_property_id to dim_property.bk_property_id, filtered on is_current = true. bk_date_id is an INT yyyymmdd in this table, so it joins common.dim_date.BK_Date_Dim_Id directly with no cast, unlike the string bk_date_id in the stay and reservation facts."
    columns:
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_date_id: "Operating night as an INT yyyymmdd. Joins directly to common.dim_date.BK_Date_Dim_Id."
      available_rooms: "Rooms available to sell that night, in rooms: room count minus out_of_order_rooms."
      occupied_rooms: "Rooms with a guest in house that night, in rooms, including complimentary rooms. Equals paid_rooms plus comp_rooms."
      vacant_rooms: "Rooms available but not occupied that night, in rooms: available_rooms minus occupied_rooms."
      paid_rooms: "Occupied rooms that are paying, in rooms: occupied_rooms minus comp_rooms."
      comp_rooms: "Rooms occupied by complimentary stays (Complimentary rate segment) that night, in rooms. This is not the comp status of a property."
      out_of_order_rooms: "Rooms taken out of service that night, in rooms, for renovation or scheduled maintenance."

  fact_property_hierarchy:
    table: "Bridge with one row per property per hierarchy membership, for the Operations and Leadership hierarchies. Join bk_property_id to dim_property.bk_property_id and bk_property_hierarchy_id to dim_property_hierarchy.bk_property_hierarchy_id. Use member_flag = true for current membership, and filter the dimension join on is_current = true."
    columns:
      fact_property_hierarchy_id: "Surrogate key for one property hierarchy membership."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_property_hierarchy_id: "Hierarchy membership business key. Joins to dim_property_hierarchy.bk_property_hierarchy_id."
      member_flag: "True when the property is a member of the hierarchy."

  fact_property_segment:
    table: "Bridge with one row per property per segment membership. Each property has one Location, one Service Level and one Program segment. Join bk_property_id to dim_property.bk_property_id and bk_property_segment_id to dim_property_segment.bk_property_segment_id. Use member_flag = true, and filter the dimension join on is_current = true."
    columns:
      fact_property_segment_id: "Surrogate key for one property segment membership."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_property_segment_id: "Segment business key. Joins to dim_property_segment.bk_property_segment_id."
      member_flag: "True when the property belongs to the segment."

  fact_property_renovation:
    table: "Bridge with one row per property per renovation project, covering planned, in-progress and completed projects. Join bk_property_id to dim_property.bk_property_id and bk_property_renovation_id to dim_property_renovation.bk_property_renovation_id. Use member_flag = true, and filter the dimension join on is_current = true."
    columns:
      fact_property_renovation_id: "Surrogate key for one property renovation membership."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      bk_property_renovation_id: "Renovation project business key. Joins to dim_property_renovation.bk_property_renovation_id."
      member_flag: "True when the renovation project applies to the property."

  dim_property:
    table: "One row per property version. A brand conversion keeps the prior version with is_current = false, so filter on is_current = true for one row per property. bk_property_id is the business key shared by all versions and joins to bk_property_id in the fact and bridge tables (fact_actual_stay, fact_reservation_summary, fact_property_statistics, dim_reservation and the property bridges). vw_dim_property already combines this table with the other property tables and returns only current rows."
    columns:
      dim_property_id: "Surrogate key for one property version."
      bk_property_id: "Property business key, shared by all versions of the property. Joins to bk_property_id in the fact and bridge tables."
      property_code: "Short property code, the same value as bk_property_id."
      property_name: "Property name in the form brand name, city and area."
      brand_cd: "Brand code: ESAS (Extended Stay America Suites), ESSS (Extended Stay America Select Suites) or ESAP (Extended Stay America Premier Suites)."
      brand_name: "Brand name for brand_cd: Extended Stay America Suites, Extended Stay America Select Suites or Extended Stay America Premier Suites."
      market_name: "Market for the property, the city where it is located."
      submarket_name: "Submarket: the city followed by the local area name, such as Downtown or Airport."
      ownership_type: "Ownership model of the property: Owned or Franchised."
      address_line_1: "Street address of the property."
      city_name: "City where the property is located."
      state_cd: "Two-letter US state code of the property."
      postal_cd: "Five-digit US postal code of the property."
      country_cd: "Country code of the property. US for all properties."
      latitude: "Latitude of the property in decimal degrees."
      longitude: "Longitude of the property in decimal degrees."
      time_zone_name: "IANA time zone name of the property, such as America/New_York."
      room_count: "Number of guest rooms at the property, in rooms."
      property_status: "Operating status of the property. Open is the only value in the current data."

  dim_property_extended:
    table: "One row per property with STR benchmarking identifiers, comp status, opening, acquisition and disposition dates, and fee attributes. Join bk_property_id to dim_property.bk_property_id, and filter on is_current = true."
    columns:
      dim_property_extended_id: "Surrogate key for one property attributes row."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      open_date: "Date the property opened."
      acquisition_date: "Date the property was acquired. Null for properties that were not acquired."
      disposition_date: "Date the property was sold or otherwise disposed of. Null while the property remains in the portfolio."
      str_property_id: "STR property identifier used for STR hotel benchmarking."
      str_market_name: "STR market name: city and state of the property."
      str_submarket_name: "STR submarket name: city and local area name."
      str_chain_scale: "STR chain scale: Economy for ESAS and ESSS, Midscale for ESAP."
      str_class: "STR class: Economy Class or Midscale Class."
      str_location_type: "STR location type: Airport, Urban, Interstate, Small Metro/Town or Suburban."
      comp_status: "Comp status for same-property comparisons: Comp or Non-Comp. A property is Non-Comp when it was acquired within the last 13 months or had a full renovation overlapping that window. Set at each dimension load and not restated for past periods."
      comp_status_reason: "Reason for a Non-Comp status: Acquired within 13 months or Full renovation in comparison window. Null for Comp properties."
      pet_fee_amount: "Pet fee in USD per night for a stay with pets."
      franchise_fee_pct: "Franchise fee rate in percent. Populated only for Franchised properties."
      management_fee_pct: "Management fee rate in percent. Populated only for Franchised properties."

  dim_property_hierarchy:
    table: "One row per property per hierarchy version, for the Operations hierarchy (division, region, district, property) and the Leadership hierarchy (DVP, RVP or RDO, DM, GM). A district manager change keeps the prior Leadership version with is_current = false. Join bk_property_hierarchy_id from fact_property_hierarchy, and filter on is_current = true. Each level_N_name column names the level and the matching level_N_value column holds its value."
    columns:
      dim_property_hierarchy_id: "Surrogate key for one hierarchy version of a property."
      bk_property_hierarchy_id: "Hierarchy membership business key, shared by all versions. Joins from fact_property_hierarchy.bk_property_hierarchy_id."
      hierarchy_name: "Hierarchy name: Operations or Leadership."
      level_1_name: "Name of level 1: Division for Operations, DVP for Leadership."
      level_1_value: "Value at level 1: the division (East, Central, South or West) for Operations, or the DVP name for Leadership."
      level_2_name: "Name of level 2: Region for Operations, or RVP or RDO for Leadership depending on who leads the region."
      level_2_value: "Value at level 2: the region name for Operations, or the RVP or RDO name for Leadership."
      level_3_name: "Name of level 3: District for Operations, DM for Leadership."
      level_3_value: "Value at level 3: the district name for Operations, or the district manager name for Leadership."
      level_4_name: "Name of level 4: Property for Operations, GM for Leadership."
      level_4_value: "Value at level 4: the property name for Operations, or the general manager name for Leadership."
      level_5_name: "Name of level 5. Null in the current hierarchies; reserved for deeper levels."
      level_5_value: "Value at level 5. Null in the current hierarchies; reserved for deeper levels."
      level_6_name: "Name of level 6. Null in the current hierarchies; reserved for deeper levels."
      level_6_value: "Value at level 6. Null in the current hierarchies; reserved for deeper levels."
      level_7_name: "Name of level 7. Null in the current hierarchies; reserved for deeper levels."
      level_7_value: "Value at level 7. Null in the current hierarchies; reserved for deeper levels."
      level_8_name: "Name of level 8. Null in the current hierarchies; reserved for deeper levels."
      level_8_value: "Value at level 8. Null in the current hierarchies; reserved for deeper levels."
      level_9_name: "Name of level 9. Null in the current hierarchies; reserved for deeper levels."
      level_9_value: "Value at level 9. Null in the current hierarchies; reserved for deeper levels."
      level_10_name: "Name of level 10. Null in the current hierarchies; reserved for deeper levels."
      level_10_value: "Value at level 10. Null in the current hierarchies; reserved for deeper levels."

  dim_property_segment:
    table: "One row per property segment, identified by segment type (Location, Service Level or Program) and segment name. Join bk_property_segment_id from fact_property_segment.bk_property_segment_id, and filter on is_current = true."
    columns:
      dim_property_segment_id: "Surrogate key for one property segment."
      bk_property_segment_id: "Segment business key. Joins from fact_property_segment.bk_property_segment_id."
      segment_type: "Segment type: Location, Service Level or Program."
      segment_name: "Segment name. Location: Airport, Urban, Interstate, Small Metro/Town or Suburban. Service Level: Economy Extended Stay, Value Extended Stay or Midscale Extended Stay. Program: Tiger Site or Standard Operations."
      segment_desc: "Description of the segment: its segment type followed by its segment name."

  dim_property_renovation:
    table: "One row per renovation project at a property, with type, phase, status as of the latest load, planned or actual dates, rooms impacted and capital budget. Join bk_property_renovation_id from fact_property_renovation.bk_property_renovation_id, and filter on is_current = true."
    columns:
      dim_property_renovation_id: "Surrogate key for one renovation project."
      bk_property_renovation_id: "Renovation project business key. Joins from fact_property_renovation.bk_property_renovation_id."
      renovation_type: "Project type: Full Renovation, Soft Goods Refresh or Brand Conversion."
      renovation_phase: "Phase as of the latest load: Design for planned projects, Phase 1 - Guest Rooms for in-progress projects, or Closeout for completed projects."
      renovation_status: "Status as of the latest load: Planned, In Progress or Complete."
      renovation_start_date: "Planned or actual start date of the project."
      renovation_end_date: "Planned or actual end date of the project."
      rooms_impacted_count: "Number of rooms taken out of service by the project, in rooms."
      capex_budget_amount: "Capital budget for the project in USD, based on the number of rooms impacted."

  dim_reservation:
    table: "One row per reservation version from the reservation system. A reservation whose dates changed keeps its prior version with is_current = false. Join bk_reservation_id to fact_reservation_summary.bk_reservation_id and fact_actual_stay.bk_reservation_id, and bk_property_id to dim_property.bk_property_id. Filter on is_current = true."
    columns:
      dim_reservation_id: "Surrogate key for one reservation version."
      bk_reservation_id: "Reservation business key, shared by all versions of the reservation. Joins to fact_reservation_summary and fact_actual_stay."
      bk_property_id: "Property business key. Joins to dim_property.bk_property_id."
      confirmation_number: "Guest-facing confirmation number for the reservation."
      reservation_status: "Reservation status: Reserved, In House, Checked Out, Cancelled or No Show."
      reservation_source: "Source system of the booking: Brand Web, Mobile App, CRS, HotelKey PMS, OTA Connect or GDS."
      adults_count: "Number of adults on the reservation, in persons."
      children_count: "Number of children on the reservation, in persons."
      affiliate_cd: "Affiliate code: AAA, AARP or USAA. Null when no affiliate applies."
      affiliate_name: "Affiliate name for affiliate_cd: American Automobile Association, AARP or USAA. Null when no affiliate applies."

  dim_crm_account:
    table: "One row per CRM (Salesforce) account, with account classification, parent and ultimate-parent links, industry codes, Dun & Bradstreet firmographics, sales owner and region, billing location and contract dates. Join bk_crm_account_id to fact_reservation_summary.bk_crm_account_id, and preferred_rate_segment_id to dim_rate_segment.bk_rate_segment_id. Filter on is_current = true."
    columns:
      dim_crm_account_id: "Surrogate key for one CRM account version."
      bk_crm_account_id: "CRM account business key. Joins to fact_reservation_summary.bk_crm_account_id and to the parent and merged-into account keys."
      account_number: "Account number as recorded in the CRM."
      account_name: "Name of the account."
      account_type: "Account type: Corporate, Insurance / Relocation, Staffing Agency, Government, Airline or Travel Management Company."
      account_status: "Account status: Active, Inactive or Prospect."
      account_tier: "Account tier: Platinum, Gold, Silver or Bronze."
      parent_account_id: "Business key of the parent account. Joins to dim_crm_account.bk_crm_account_id. Null when the account has no parent."
      parent_account_name: "Name of the parent account. Null when the account has no parent."
      ultimate_parent_account_id: "Business key of the top account in the parent chain. Joins to dim_crm_account.bk_crm_account_id."
      ultimate_parent_account_name: "Name of the top account in the parent chain."
      merged_into_account_id: "Business key of the account this account was merged into. Joins to dim_crm_account.bk_crm_account_id. Null when not merged."
      industry_name: "Industry of the account, such as Construction, Insurance, Healthcare Staffing, Rail, Energy, Government, Airline, Relocation, Technology, Manufacturing, Logistics or Travel Management."
      sic_cd: "Standard Industrial Classification code for the account's industry."
      naics_cd: "NAICS code for the account's industry."
      dnb_duns_number: "Dun & Bradstreet DUNS number of the account."
      dnb_business_name: "Business name as recorded by Dun & Bradstreet."
      dnb_employee_count: "Employee count as recorded by Dun & Bradstreet, in persons."
      dnb_annual_revenue_amount: "Annual revenue in USD as recorded by Dun & Bradstreet."
      dnb_hq_city_name: "City of the headquarters as recorded by Dun & Bradstreet."
      dnb_hq_state_cd: "State code of the headquarters as recorded by Dun & Bradstreet."
      dnb_hq_country_cd: "Country code of the headquarters as recorded by Dun & Bradstreet."
      dnb_risk_score: "Dun & Bradstreet risk score as an integer from 1 to 100."
      account_owner_name: "Name of the ESA sales owner of the account."
      account_owner_email: "Work email address of the ESA sales owner of the account."
      sales_region_name: "Sales region of the account: East, Central, South or West."
      billing_city_name: "Billing city of the account."
      billing_state_cd: "Billing state code of the account."
      billing_postal_cd: "Billing postal code of the account."
      billing_country_cd: "Billing country code of the account."
      website_domain: "Web domain of the account."
      payment_terms: "Payment terms: Net 30, Net 45, Direct Bill or Credit Card."
      credit_limit_amount: "Credit limit for the account in USD."
      account_created_date: "Date the account was created in the CRM."
      last_activity_date: "Date of the most recent logged activity on the account."
      contract_start_date: "Start date of the account's contract. Null when the account has no contract."
      contract_end_date: "End date of the account's contract. Null when the account has no contract."
      preferred_rate_segment_id: "Preferred rate segment business key. Joins to dim_rate_segment.bk_rate_segment_id."
      key_account_flag: "True for key accounts."

  dim_channel:
    table: "One row per booking channel, with network, platform and partner. Join bk_channel_id to fact_reservation_summary.bk_channel_id. Filter on is_current = true."
    columns:
      dim_channel_id: "Surrogate key for one booking channel."
      bk_channel_id: "Channel business key. Joins to fact_reservation_summary.bk_channel_id."
      channel_network: "Channel network: Direct or Indirect."
      channel_name: "Channel name, such as Brand Web, Mobile App, Call Center, Walk-In, OTA - Expedia, OTA - Booking.com, GDS or Corporate Sales."
      channel_platform: "Platform the booking came through: Web, App, Voice, Property, GDS or Sales."
      channel_partner: "Partner or operator of the channel, such as ESA, ESA Reservations, Expedia Group, Booking Holdings, Sabre / Amadeus or ESA Corporate Sales."

  dim_rate_segment:
    table: "One row per rate segment, covering public, negotiated, qualified, merchant, contract and complimentary rates, with category, code, type and partner. Join bk_rate_segment_id from fact_actual_stay and fact_reservation_summary, and from dim_crm_account.preferred_rate_segment_id. Filter on is_current = true."
    columns:
      dim_rate_segment_id: "Surrogate key for one rate segment."
      bk_rate_segment_id: "Rate segment business key. Joins to fact_actual_stay, fact_reservation_summary and dim_crm_account.preferred_rate_segment_id."
      rate_segment_name: "Rate segment name: Best Available Rate, Weekly Rate, Monthly Rate, Corporate Negotiated, Government / Military, AAA / Senior, OTA Merchant, Airline Crew, Relocation / Insurance or Complimentary."
      rate_category: "Rate category: Transient, Extended Stay, Corporate, Government, Discount, Wholesale, Contract or Complimentary."
      rate_code: "Short rate code: BAR, WKLY, MNTH, CORP, GOV, AAA, OTAM, CREW, RELO or COMP."
      rate_type: "Rate type: Public, Negotiated, Qualified, Merchant, Contract or Non-Revenue."
      rate_partner: "Partner the rate is offered through, such as Corporate Accounts, Per Diem Programs, AAA / AARP, Online Travel Agencies or Airline Crew Programs. Null when the rate has no partner."

  dim_promotion:
    table: "One row per promotion code; NONE means no promotion applied. Holds the discount type and value, length-of-stay limits and the arrival-date window of each promotion. Join bk_promo_cd to fact_reservation_summary.bk_promo_cd. Filter on is_current = true."
    columns:
      dim_promotion_id: "Surrogate key for one promotion."
      bk_promo_cd: "Promotion code. Joins to fact_reservation_summary.bk_promo_cd. NONE means no promotion."
      promotion_name: "Promotion name, such as Stay 7+ and Save or Monthly Saver."
      campaign_name: "Marketing campaign the promotion belongs to."
      discount_type: "Discount type: Percent, Amount or None."
      discount_value: "Discount value: a percentage when discount_type is Percent, or a USD amount when discount_type is Amount. Zero for NONE."
      min_los_nights: "Minimum length of stay in nights for the promotion. Null when there is no minimum."
      max_los_nights: "Maximum length of stay in nights for the promotion. Null when there is no maximum."
      promo_start_date: "First arrival date on which the promotion applies. Null for NONE."
      promo_end_date: "Last arrival date on which the promotion applies. Null for NONE."

  dim_room_type:
    table: "One row per room type, with room code, class, bed type and count, accessibility and smoking flags. Join bk_room_type_id from fact_actual_stay and fact_reservation_summary. Filter on is_current = true."
    columns:
      dim_room_type_id: "Surrogate key for one room type."
      bk_room_type_id: "Room type business key. Joins to fact_actual_stay and fact_reservation_summary."
      room_type_cd: "Room type code: SQ, SQQ, SK, DSK, 1BR or ASQ."
      room_type_name: "Room type name: Studio Queen, Studio Two Queens, Studio King, Deluxe Studio King, One Bedroom Suite or Accessible Studio Queen."
      room_class: "Room class: Standard, Deluxe or Suite."
      bed_type: "Bed type: Queen or King."
      bed_count: "Number of beds in the room."
      accessible_flag: "True for accessible rooms."
      smoking_flag: "True for smoking rooms. No room type is flagged as a smoking room in the current data."

  dim_los:
    table: "One row per length of stay in nights, from 0 to 365, with ten banding columns (los_band_1 to los_band_10) that group the same nights in different ways. Join bk_los_id to the four LOS key columns of fact_reservation_summary (original, current, OTB and actual). Use los_band_1 for the OTB 4 Tier length-of-stay grouping. Filter on is_current = true."
    columns:
      dim_los_id: "Surrogate key for one length-of-stay value."
      bk_los_id: "Length-of-stay business key: the number of nights as a string. Joins to the four LOS key columns of fact_reservation_summary."
      los_nights: "Length of stay in nights, from 0 to 365."
      los_band_1: "OTB 4 Tier band: 0-6, 7-14, 15-29 or 30+ nights. The standard ResStay length-of-stay grouping."
      los_band_2: "Weekly band: 0-6, 7-13, 14-20, 21-27 or 28+ nights."
      los_band_3: "Transient or extended band: Transient (0-6) or Extended (7+) nights."
      los_band_4: "Night band: 0-3, 4-6, 7-13, 14-29, 30-59 or 60+ nights."
      los_band_5: "Nightly, weekly or monthly band: Nightly (0-6), Weekly (7-29) or Monthly (30+) nights."
      los_band_6: "Short, medium or long band: Short (0-3), Medium (4-13) or Long (14+) nights."
      los_band_7: "Whole-week band: 0 wk, 1 wk, 2 wk, 3 wk or 4+ wk."
      los_band_8: "Long-term band: Under 30, 30-89, 90-179 or 180+ nights."
      los_band_9: "Stay type band: Day Use (0 nights), Single Night (1), 2-6 Nights or 7+ Nights."
      los_band_10: "Stay length band: Hotel Stay (0-29 nights) or Extended Tenancy (30+ nights)."

  dim_date:
    table: "One row per calendar day from 1980-01-01 through 2050-12-31, in the common schema. BK_Date_Dim_Id is an INT yyyymmdd key: join it to bk_date_id in fact_property_statistics, and to CAST(bk_date_id AS INT) in fact_actual_stay and fact_reservation_summary. Holds calendar, week, month, quarter and year attributes, US federal holiday flags and prior-year comparison dates."
    columns:
      BK_Date_Dim_Id: "Date key as an INT in yyyymmdd form. Joins to bk_date_id in fact_property_statistics and to CAST(bk_date_id AS INT) in the stay and reservation facts."
      Date_Dt: "Calendar date."
      Day_Of_Week_Nbr: "Day of the week as a number: 1 for Monday through 7 for Sunday."
      Day_Of_Week_Name: "Name of the day of the week, such as Monday."
      Day_Of_Month_Nbr: "Day of the month, from 1 to 31."
      Day_Of_Year_Nbr: "Day of the year, from 1 to 366."
      Week_Of_Year_Nbr: "ISO week number of the year."
      Week_Start_Dt: "Monday that starts the week."
      Week_End_Dt: "Sunday that ends the week."
      Month_Nbr: "Month number, from 1 to 12."
      Month_Name: "Name of the month, such as January."
      Month_Start_Dt: "First day of the month."
      Month_End_Dt: "Last day of the month."
      Qtr_Nbr: "Calendar quarter number, from 1 to 4."
      Qtr_Name: "Calendar quarter label, Q1 to Q4."
      Yr_Nbr: "Calendar year."
      Yr_Month_Nbr: "Calendar year and month as an INT in yyyymm form."
      Is_Weekend_Flg: "True for Saturday and Sunday."
      Is_Holiday_Flg: "True for a US federal holiday on its actual date, not its observed date."
      Holiday_Name: "Name of the US federal holiday. Null on other days."
      Same_Day_Last_Yr_Dt: "The same calendar date one year earlier."
      Same_Weekday_Last_Yr_Dt: "The same weekday one year earlier, 364 days before the date."

  vw_dim_property:
    table: "One row per current property, combining the property master, extended property attributes, the Operations and Leadership hierarchies, property segments, and current and prior renovations. Join bk_property_id to the bk_property_id column of the fact tables. The view returns only current rows, so no is_current filter is needed."
    columns:
      dim_property_id: "Surrogate key of the current property version."
      bk_property_id: "Property business key. Joins to bk_property_id in the fact and bridge tables. One row per property."
      property_code: "Short property code, the same value as bk_property_id."
      property_name: "Property name in the form brand name, city and area."
      brand_cd: "Brand code: ESAS, ESSS or ESAP."
      brand_name: "Brand name for brand_cd: Extended Stay America Suites, Extended Stay America Select Suites or Extended Stay America Premier Suites."
      market_name: "Market for the property, the city where it is located."
      submarket_name: "Submarket: the city followed by the local area name."
      ownership_type: "Ownership model of the property: Owned or Franchised."
      address_line_1: "Street address of the property."
      city_name: "City where the property is located."
      state_cd: "Two-letter US state code of the property."
      postal_cd: "Five-digit US postal code of the property."
      country_cd: "Country code of the property. US for all properties."
      latitude: "Latitude of the property in decimal degrees."
      longitude: "Longitude of the property in decimal degrees."
      time_zone_name: "IANA time zone name of the property, such as America/New_York."
      room_count: "Number of guest rooms at the property, in rooms."
      property_status: "Operating status of the property. Open is the only value in the current data."
      open_date: "Date the property opened."
      acquisition_date: "Date the property was acquired. Null for properties that were not acquired."
      disposition_date: "Date the property was sold or otherwise disposed of. Null while the property remains in the portfolio."
      str_property_id: "STR property identifier used for STR hotel benchmarking."
      str_market_name: "STR market name: city and state of the property."
      str_submarket_name: "STR submarket name: city and local area name."
      str_chain_scale: "STR chain scale: Economy for ESAS and ESSS, Midscale for ESAP."
      str_class: "STR class: Economy Class or Midscale Class."
      str_location_type: "STR location type: Airport, Urban, Interstate, Small Metro/Town or Suburban."
      comp_status: "Comp status for same-property comparisons: Comp or Non-Comp. A property is Non-Comp when it was acquired within the last 13 months or had a full renovation overlapping that window. Set at each dimension load and not restated for past periods."
      comp_status_reason: "Reason for a Non-Comp status: Acquired within 13 months or Full renovation in comparison window. Null for Comp properties."
      pet_fee_amount: "Pet fee in USD per night for a stay with pets."
      franchise_fee_pct: "Franchise fee rate in percent. Populated only for Franchised properties."
      management_fee_pct: "Management fee rate in percent. Populated only for Franchised properties."
      division_name: "Operations division of the property: East, Central, South or West."
      region_name: "Operations region of the property, such as Northeast or Texas."
      district_name: "Operations district of the property."
      dvp_name: "Name of the DVP over the property."
      rvp_name: "Name of the RVP for the property. Null when the region is led by an RDO."
      rdo_name: "Name of the RDO for the property. Null when the region is led by an RVP."
      rvp_rdo_name: "Name of the RVP or RDO, whichever leads the property's region."
      dm_name: "Name of the district manager (DM) for the property."
      gm_name: "Name of the general manager (GM) of the property."
      segment1: "Location segment of the property: Airport, Urban, Interstate, Small Metro/Town or Suburban."
      segment2: "Service Level segment of the property: Economy Extended Stay, Value Extended Stay or Midscale Extended Stay."
      segment3: "Program segment of the property: Tiger Site or Standard Operations."
      tiger_site_flag: "True when the property's Program segment is Tiger Site."
      current_renovation_type: "Type of the current renovation: the in-progress project if there is one, otherwise the next planned project. Null when none."
      current_renovation_phase: "Phase of the current renovation as of the latest load. Null when there is no current renovation."
      current_renovation_status: "Status of the current renovation: In Progress or Planned. Null when there is no current renovation."
      current_renovation_start_date: "Start date of the current renovation. Null when there is no current renovation."
      current_renovation_end_date: "End date of the current renovation. Null when there is no current renovation."
      current_renovation_rooms_impacted: "Rooms impacted by the current renovation, in rooms. Null when there is no current renovation."
      prior_renovation_type: "Type of the most recently completed renovation. Null when none has been completed."
      prior_renovation_status: "Status of the most recently completed renovation, which is Complete. Null when none has been completed."
      prior_renovation_start_date: "Start date of the most recently completed renovation. Null when none has been completed."
      prior_renovation_end_date: "End date of the most recently completed renovation. Null when none has been completed."
      is_under_renovation_flag: "True when a renovation is in progress at the latest load."
      acquired_flag: "True when the property was acquired."
      franchise_flag: "True when the property's ownership type is Franchised."
      open_year: "Calendar year the property opened."
      property_age_years: "Whole years since the property opened, calculated on the query date."
      ops_hierarchy_path: "Operations path of the property: division, then region, then district, separated by >."
      leadership_path: "Leadership path of the property: DVP, then RVP or RDO, then DM, then GM, separated by >."
